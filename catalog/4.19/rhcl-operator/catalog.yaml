                {
                  "name": "provider-ref"
                }
              ],
              "targetRef": {
                "group": "gateway.networking.k8s.io",
                "kind": "Gateway",
                "name": "example-gateway"
              }
            }
          },
          {
            "apiVersion": "kuadrant.io/v1",
            "kind": "RateLimitPolicy",
            "metadata": {
              "name": "ratelimitpolicy-sample"
            },
            "spec": {
              "limits": {
                "toys": {
                  "rates": [
                    {
                      "limit": 50,
                      "window": "1m"
                    }
                  ]
                }
              },
              "targetRef": {
                "group": "gateway.networking.k8s.io",
                "kind": "HTTPRoute",
                "name": "toystore"
              }
            }
          },
          {
            "apiVersion": "kuadrant.io/v1",
