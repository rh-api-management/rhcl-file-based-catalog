    annotations:
      alm-examples: |-
        [
          {
            "apiVersion": "extensions.kuadrant.io/v1alpha1",
            "kind": "OIDCPolicy",
            "metadata": {
              "name": "oidcpolicy-sample"
            },
            "spec": {
              "provider": {
                "cliendID": "exampleID",
                "issuerURL": "https://idp.example.org/"
              },
              "targetRef": {
                "group": "gateway.networking.k8s.io",
                "kind": "HTTPRoute",
                "name": "example-route"
              }
            }
          },
          {
            "apiVersion": "extensions.kuadrant.io/v1alpha1",
            "kind": "PlanPolicy",
            "metadata": {
              "labels": {
                "app.kubernetes.io/created-by": "kuadrant-operator",
                "app.kubernetes.io/instance": "planpolicy-sample",
                "app.kubernetes.io/managed-by": "kustomize",
                "app.kubernetes.io/name": "planpolicy",
                "app.kubernetes.io/part-of": "kuadrant-operator"
              },
              "name": "planpolicy-sample"
            },
            "spec": {
              "plans": [
                {
                  "limits": {
                    "daily": 5
                  },
                  "predicate": "has(auth.identity) \u0026\u0026 auth.identity.metadata.annotations[\"secret.kuadrant.io/plan-id\"] == \"gold\"\n",
                  "tier": "gold"
                },
                {
                  "limits": {
                    "daily": 2
                  },
                  "predicate": "has(auth.identity) \u0026\u0026 auth.identity.metadata.annotations[\"secret.kuadrant.io/plan-id\"] == \"silver\"\n",
                  "tier": "silver"
                },
                {
                  "limits": {
                    "daily": 1
                  },
                  "predicate": "has(auth.identity) \u0026\u0026 auth.identity.metadata.annotations[\"secret.kuadrant.io/plan-id\"] == \"bronze\"\n",
                  "tier": "bronze"
                }
              ],
              "targetRef": {
                "group": "gateway.networking.k8s.io",
                "kind": "HTTPRoute",
                "name": "example-route"
              }
            }
          },
          {
            "apiVersion": "kuadrant.io/v1",
            "kind": "AuthPolicy",
            "metadata": {
              "name": "authpolicy-sample"
            },
            "spec": {
              "rules": {
                "authentication": {
                  "apikey": {
                    "apiKey": {
                      "selector": {}
                    },
                    "credentials": {
                      "authorizationHeader": {
                        "prefix": "APIKEY"
                      }
                    }
                  }
                }
              },
              "targetRef": {
                "group": "gateway.networking.k8s.io",
                "kind": "HTTPRoute",
                "name": "toystore"
              }
            }
          },
          {
            "apiVersion": "kuadrant.io/v1",
            "kind": "DNSPolicy",
            "metadata": {
              "name": "dnspolicy-sample"
            },
            "spec": {
              "healthCheck": {
                "protocol": "HTTP"
              },
              "providerRefs": [
                {
                  "name": "provider-ref"
                }
              ],
              "targetRef": {
                "group": "gateway.networking.k8s.io",
                "kind": "Gateway",
                "name": "example-gateway"
              }
            }
          },
          {
            "apiVersion": "kuadrant.io/v1",
            "kind": "RateLimitPolicy",
            "metadata": {
              "name": "ratelimitpolicy-sample"
            },
            "spec": {
              "limits": {
                "toys": {
                  "rates": [
                    {
                      "limit": 50,
                      "window": "1m"
                    }
                  ]
                }
              },
              "targetRef": {
                "group": "gateway.networking.k8s.io",
                "kind": "HTTPRoute",
                "name": "toystore"
              }
            }
          },
          {
            "apiVersion": "kuadrant.io/v1",
            "kind": "TLSPolicy",
            "metadata": {
              "name": "tlspolicy-sample"
            },
            "spec": {
              "issuerRef": {
                "group": "cert-manager.io",
                "kind": "ClusterIssuer",
                "name": "self-signed-ca"
              },
              "targetRef": {
                "group": "gateway.networking.k8s.io",
                "kind": "Gateway",
                "name": "example-gateway"
              }
            }
          },
          {
            "apiVersion": "kuadrant.io/v1alpha1",
            "kind": "TokenRateLimitPolicy",
            "metadata": {
              "name": "token-limit-free",
              "namespace": "gateway-system"
            },
            "spec": {
              "limits": {
                "free": {
                  "counters": [
                    {
                      "expression": "auth.identity.userid"
                    }
                  ],
                  "rates": [
                    {
                      "limit": 20000,
                      "window": "1d"
                    }
                  ],
                  "when": [
                    {
                      "predicate": "request.auth.claims[\"kuadrant.io/groups\"].split(\",\").exists(g, g == \"free\")"
                    }
                  ]
                },
                "gold": {
                  "counters": [
                    {
                      "expression": "auth.identity.userid"
                    }
                  ],
                  "rates": [
                    {
                      "limit": 200000,
                      "window": "1d"
                    }
                  ],
                  "when": [
                    {
                      "predicate": "request.auth.claims[\"kuadrant.io/groups\"].split(\",\").exists(g, g == \"gold\")"
                    }
                  ]
                }
              },
              "targetRef": {
                "group": "gateway.networking.k8s.io",
                "kind": "Gateway",
                "name": "my-llm-gateway"
              }
            }
          },
          {
            "apiVersion": "kuadrant.io/v1beta1",
            "kind": "Kuadrant",
            "metadata": {
              "name": "kuadrant-sample"
            },
            "spec": {}
          }
