    value:
      annotations:
        alm-examples: |-
          [
            {
              "apiVersion": "mcp.kuadrant.io/v1alpha1",
              "kind": "MCPGatewayExtension",
              "metadata": {
                "name": "mcp-gateway-extension",
                "namespace": "mcp-system"
              },
              "spec": {
                "targetRef": {
                  "group": "gateway.networking.k8s.io",
                  "kind": "Gateway",
                  "name": "mcp-gateway",
                  "namespace": "gateway-system",
                  "sectionName": "mcp"
                }
              }
            },
            {
              "apiVersion": "mcp.kuadrant.io/v1alpha1",
              "kind": "MCPServerRegistration",
              "metadata": {
                "name": "example-server",
                "namespace": "mcp-test"
              },
              "spec": {
                "toolPrefix": "example_",
                "targetRef": {
                  "group": "gateway.networking.k8s.io",
                  "kind": "HTTPRoute",
                  "name": "example-route"
                }
              }
            },
            {
              "apiVersion": "mcp.kuadrant.io/v1alpha1",
              "kind": "MCPVirtualServer",
